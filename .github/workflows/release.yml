name: Release PCM package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build package and repository index
        run: python3 scripts/build_release.py "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release with package zip
        uses: softprops/action-gh-release@v2
        with:
          files: build/sao-kicad-lib-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true

      - name: Commit updated metadata.json and pcm/ index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata.json pcm/
          git diff --cached --quiet || git commit -m "Publish ${{ steps.ver.outputs.version }} to PCM repository index"
          git push origin HEAD:main
